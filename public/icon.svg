<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shopping Bag / Basket Shape -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Bag handles -->
    <path d="M100 130 C100 60, 220 60, 220 130" fill="none" stroke="url(#basketGrad)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Bag body -->
    <path d="M40 130 L280 130 C300 130, 315 145, 310 165 L285 300 C280 320, 260 335, 240 335 L80 335 C60 335, 40 320, 35 300 L10 165 C5 145, 20 130, 40 130 Z" fill="url(#basketGrad)"/>
    
    <!-- Checkmark accent inside -->
    <path d="M110 230 L145 265 L215 185" fill="none" stroke="#10b981" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sparkle accent -->
    <circle cx="260" cy="90" r="14" fill="#fbbf24" />
  </g>
</svg>
